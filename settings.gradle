pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'cyberfarm-hats'

// CyberFarm is built from its sources next door, so the addon always compiles and runs against the current mod
includeBuild '../cyberfarm'
