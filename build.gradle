plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = mod_version
group = 'com.cyberhats'

base {
    archivesName = 'cyberhats'
}

// Minecraft 1.20.1 runs on Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    // Patchouli and JEI, to read the handbook entry and the recipes in the dev client
    mavenCentral()
    maven { url = "https://maven.blamejared.com" }
    // CyberFarm, straight from its GitHub releases. -Pcyberfarm_repo=file:///some/folder/ reads the same layout
    // (v<version>/cyberfarm-<version>.jar) from a folder instead, to build against a CyberFarm not yet released
    ivy {
        url = providers.gradleProperty('cyberfarm_repo').getOrElse('https://github.com/Gianni1707/cyberfarm/releases/download/')
        patternLayout { artifact 'v[revision]/[module]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'com.cyberfarm' }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            // ./gradlew runClient -Pworld="New World" opens that world straight away
            if (project.hasProperty('world')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('world'))
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', 'cyberhats'
        }
    }

    mods {
        cyberhats {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    modImplementation "com.cyberfarm:cyberfarm:${cyberfarm_version}"
    // JEI is optional: only its API at compile time, for the information page on every hat
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    modRuntimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
}

jar {
    // mods.toml reads the mod version from here
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
