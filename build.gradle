plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.cyberhats'

base {
    archivesName = 'cyberhats'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // GuideME and JEI, to read the handbook page and the recipes in the dev client
    mavenCentral()
    maven { url = "https://maven.blamejared.com" }
    // CyberFarm, straight from its GitHub releases. -Pcyberfarm_repo=file:///some/folder/ reads the same layout
    // (v<version>/cyberfarm-<version>.jar) from a folder instead, to build against a CyberFarm not yet released
    ivy {
        url = providers.gradleProperty('cyberfarm_repo').getOrElse('https://github.com/Gianni1707/cyberfarm/releases/download/')
        patternLayout { artifact 'v[revision]/[module]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'com.cyberfarm' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // ./gradlew runClient -Pworld="New World" opens that world straight away
            if (project.hasProperty('world')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('world'))
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cyberhats'
        }
    }

    mods {
        cyberhats {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "com.cyberfarm:cyberfarm:${cyberfarm_version}"
    // JEI is optional: only its API at compile time, for the information page on every hat
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

jar {
    // neoforge.mods.toml reads the mod version from here
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
