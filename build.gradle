plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.cyberhats'

base {
    archivesName = 'cyberhats'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // GuideME and JEI, to read the handbook page and the recipes in the dev client
    mavenCentral()
    maven { url = "https://maven.blamejared.com" }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // ./gradlew runClient -Pworld="New World" opens that world straight away
            if (project.hasProperty('world')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('world'))
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cyberhats'
        }
    }

    mods {
        cyberhats {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Replaced by the ../cyberfarm sources (see settings.gradle)
    implementation 'com.cyberfarm:cyberfarm'
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    runtimeOnly "mezz.jei:jei-26.2-neoforge:${jei_version}"
}

jar {
    // neoforge.mods.toml reads the mod version from here
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
